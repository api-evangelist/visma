async_processing:
  visma_net_erp:
    header: erp-api-background
    operations: 509
    detail: Nearly every ERP operation accepts an erp-api-background header that turns the call into a
      background job, acknowledged immediately and completed asynchronously. This is the ERP API's answer
      to long-running writes.
    docs: https://docs.vismasoftware.no/vismanetapi/api-reference/features/background/

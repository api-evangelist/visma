note: Neither API uses application/problem+json. eAccounting publishes a complete, stable numeric error
  catalogue (56 codes) in a three-field envelope; Visma.net ERP publishes no error-code reference and
  its spec declares only HTTP statuses, in both JSON and XML media types.

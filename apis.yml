- aid: visma:visma-business-nxt-api
  name: Visma Business NXT GraphQL API
  description: 'GraphQL API for Business NXT, Visma''s ERP for mid-market Nordic customers. Two endpoints
    share one schema: /api/graphql for a Visma.net user context (authorization code with PKCE) and /api/graphql-service
    for machine-to-machine access (client credentials). The schema is tenant-shaped — it includes each
    customer''s data-model-extension tables — and introspection is authentication-gated, so no SDL is
    captured here.'
  humanURL: https://docs.vismasoftware.no/businessnxtapi/
  baseURL: https://business.visma.net/api/graphql

  name: Visma.net ERP API
  description: 'REST API for Visma.net ERP (Visma Net Financials) covering general ledger, accounts receivable
    and payable, customers, suppliers, sales orders, purchase orders, inventory, projects and dimensions.
    395 paths / 511 operations, published as OpenAPI 3.0.4 in two flavours that share an identical path
    and schema surface but differ in OAuth flow: the Service API uses client credentials, the Interactive
    API uses authorization code with named scopes.'

          text/json:
            schema:
              $ref: '#/components/schemas/SupplierUpdateDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/SupplierUpdateDto'
          text/xml:
            schema:
              $ref: '#/components/schemas/SupplierUpdateDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupplierUpdateDto'
        required: true
        x-bodyName: supplier
      responses:
        '204':
          description: NoContent
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
        '412':
          description: Supplier version does not match with If-Match header

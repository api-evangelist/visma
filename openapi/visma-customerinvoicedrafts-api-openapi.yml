          readOnly: true
        ArticleId:
          type:
          - string
          - 'null'
          description: 'Purpose: Null if text row'
          format: uuid
        IsServiceArticle:
          type: boolean
          description: True if the article is a service article. False otherwise
          readOnly: true
        AmountNoVat:
          type: number
          description: Amount on the row excluding VAT
          format: double
          readOnly: true
        PercentVat:
          type: number
          format: double

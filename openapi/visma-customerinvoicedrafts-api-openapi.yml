          type:
          - string
          - 'null'
          description: 'Purpose: Returns the article number from the entered ArticleId'
        IsTextRow:
          type: boolean
        Text:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - 'null'
          description: 'Default: For non text rows, default value will be the article''s name; for text rows, there should be at least one character in place'
        UnitPrice:
          type:
          - number
          - 'null'
          description: 'Format: 2 decimals allowed if the customer is domestic or 4 decimals if foreign. When omitted and ArticleId is provided, the article''s stored price may be used automatically depending on account configuration (net price or gross price depending on whether the invoice includes VAT). An explicitly provided value is always used as-is. The default behavior when unit price is zero is specified by setting ReplaceUnitPriceWhenZero on the customer invoice draft.'
          format: double
        IsDiscountInFixedAmount:
          type: boolean
          description: If true, then discount of the row is in fixed amount. If false, then discount of the row is in percentage.
          readOnly: true
        DiscountFixedAmount:
          type:
          - number
          - 'null'
          description: 'Format: 2 decimals. Discount of the row in fixed amount.'
          format: double
          readOnly: true
        DiscountPercentage:
          maximum: 1
          minimum: 0
          type: number
          description: 'Format: 4 decimals allowed. Discount of the row in percentage.'
          format: double
        Quantity:
          type: number
          description: 'Format: 2 decimals. Quantity of the article on the row.'
          format: double
        WorkCostType:
          type: integer
          description: Only used for Rot/Rut invoice.
          format: int32
        IsWorkCost:
          type: boolean
        WorkHours:
          type:
          - number
          - 'null'
          description: Only used for ROT/RUT invoices.
          format: double
        MaterialCosts:
          type:
          - number
          - 'null'
          description: Only used for ROT/RUT invoices.
          format: double
        ReversedConstructionServicesVatFree:
          type: boolean
        CostCenterItemId1:
          type:
          - string
          - 'null'
          description: 'Source: Get from /v2/costcenteritems'

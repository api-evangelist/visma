        startDate:
          $ref: '#/components/schemas/DtoValueOfNullableOfDateTime'
        endDate:
          $ref: '#/components/schemas/DtoValueOfNullableOfDateTime'
        accountingCostRef:
          $ref: '#/components/schemas/DtoValueOfString'
        originatorDocRef:
          $ref: '#/components/schemas/DtoValueOfString'
        contractDocRef:
          $ref: '#/components/schemas/DtoValueOfString'
        referenceNumber:
          $ref: '#/components/schemas/DtoValueOfString'
        customerNumber:
          $ref: '#/components/schemas/DtoValueOfString'
        childCustomerNumber:
          $ref: '#/components/schemas/DtoValueOfString'
        consolidateInvoices:
          $ref: '#/components/schemas/DtoValueOfNullableOfBoolean'
        documentDate:
          $ref: '#/components/schemas/DtoValueOfDateTime'
        origInvoiceDate:

    undoSplitLineInSupplierInvoiceLineUpdateDto:
      properties:
        value:
          type: boolean
      description: 'When set to true on an invoice line with Operation = Delete, the line is treated as an undo split-line request instead of an ordinary delete.

        The field only has an effect for split child lines; the selected line must belong to a split hierarchy.

        The undo removes the split child line and restores the amount/quantity to the parent split line through the same undo split action as the UI.

        On prebooked documents, ordinary line delete remains blocked; this field may be used to request undo split for an eligible split child line.

        When omitted or false, Delete keeps its normal delete behavior.'

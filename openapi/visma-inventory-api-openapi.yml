      type: object
      properties:
        type:
          enum:
          - NonStockItem
          - LaborItem
          - ServiceItem
          - ChargeItem
          - ExpenseItem
          - FinishedGoodItem
          - ComponentPartItem
          - SubassemblyItem
          type: string
        attributes:

description: Visma ships client-side UI building blocks rather than API SDKs. Visma Unified Design (VUD)
  is the group-wide design system; Visma Software Nordic publishes Lit-based web components that embed
  Visma product surfaces (the Gaia assistant chat, the module switcher, onboarding) into third-party and
  internal front-ends.
families:
- name: Visma Unified Design (VUD)
  kind: design-system
  loader: npm @vismaux/vud (framework-agnostic HTML/CSS), @vismaux/ngx-vud (Angular), @vismaux/vud-icons,
    @vismaux/tailwindcss-vud
  repository: https://github.com/Visma-Unified-Design
  components:
  - responsive grid
  - form controls
  - navigation
  - icon set
  - Tailwind theme
- name: Visma Software Nordic web components
